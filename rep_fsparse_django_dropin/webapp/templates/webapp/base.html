{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Factsheet Parser{% endblock %}</title>
  <link rel="icon" href="{% static 'webapp/img/NSE.ico' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
  <link rel="stylesheet" href="{% static 'webapp/css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="bg-body-tertiary">
<header class="navbar navbar-dark bg-dark shadow-sm sticky-top">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
      <img src="{% static 'webapp/img/logo_nse.png' %}" alt="NSE" height="36">
      <span class="fw-semibold">FACTSHEET PARSER</span>
    </a>
    {% block header_actions %}{% endblock %}
  </div>
</header>
<main class="container-fluid py-3 px-3 px-lg-4">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
