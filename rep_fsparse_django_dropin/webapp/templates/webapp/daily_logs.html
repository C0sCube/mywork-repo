{% extends 'webapp/base.html' %}{% load static %}
{% block title %}Daily Logs{% endblock %}
{% block header_actions %}<div class="d-flex align-items-center gap-2"><select id="LogSelect" class="form-select form-select-sm"></select><input type="date" id="dateSelect" class="form-control form-control-sm"><button class="btn btn-primary btn-sm" data-action="load">Load</button><button class="btn btn-outline-light btn-sm" data-action="refresh"><span class="material-symbols-outlined">autorenew</span></button>{% if role == 'admin' %}<a href="{% url 'list_json_files' %}" class="btn btn-outline-light btn-sm" data-action="json"><span class="material-symbols-outlined">data_object</span></a><a href="{% url 'list_csv_files' %}" class="btn btn-outline-light btn-sm" data-action="report"><span class="material-symbols-outlined">monitoring</span></a>{% endif %}<a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm" data-action="back"><span class="material-symbols-outlined">arrow_back</span></a></div>{% endblock %}
{% block content %}<div class="card tool-card"><div class="card-body"><div class="log-wrapper"><div id="lineNumbers" class="line-numbers">1</div><div id="logViewer" class="log-content">Select a date to load logs…</div></div></div></div>{% endblock %}{% block scripts %}<script src="{% static 'webapp/js/daily_logs.js' %}"></script>{% endblock %}
