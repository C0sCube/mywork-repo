{% extends 'webapp/base.html' %}{% load static %}
{% block title %}SID / KIM{% endblock %}
{% block header_actions %}<a href="{% url 'dashboard' %}" class="btn btn-outline-light" data-action="back"><span class="material-symbols-outlined">arrow_back</span></a>{% endblock %}
{% block content %}<div class="row g-3"><div class="col-12"><div class="sid-viewer d-flex align-items-center justify-content-center"><label class="drop-zone text-light flex-column gap-2 w-75" id="uploadBox"><span class="material-symbols-outlined fs-1">upload_file</span><span>Upload SID/KIM PDF</span><input type="file" id="sidPdfInput" accept="application/pdf" hidden></label><iframe id="pdfViewer" hidden></iframe></div></div><div class="col-12"><div class="card tool-card"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-md-4 sid-field" id="field-1"><label id="label1" class="form-label"></label><input class="form-control sid-input" id="input1"></div><div class="col-md-4 sid-field" id="field-2"><label id="label2" class="form-label"></label><input class="form-control sid-input" id="input2"></div><div class="col-md-4 sid-field" id="field-3"><label id="label3" class="form-label"></label><input class="form-control sid-input" id="input3"></div><div class="col-md-4"><button id="sidProcessBtn" class="btn btn-primary w-100" disabled>Process</button></div></div></div></div></div></div>{% endblock %}{% block scripts %}<script src="{% static 'webapp/js/sid_data.js' %}"></script>{% endblock %}
