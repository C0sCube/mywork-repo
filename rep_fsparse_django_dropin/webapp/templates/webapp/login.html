{% load static %}
<!DOCTYPE html>
<html lang="en">
{% include "head.html" %}

<body class="login-page">

  <div class="login-container">

    <div class="login-header">
      <img src="{% static 'webapp/img/logo_nse.png' %}" alt="Logo">
      <h1>FACTSHEET PARSER</h1>
    </div>

    <div class="login-card">
      <h2>Log In</h2>

      {% if error %}
        <div class="login-error">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'login' %}" autocomplete="off">
        
        <input type="text"
               name="username"
               class="input"
               placeholder="Username"
               required
               autofocus>

        <input type="password"
               name="password"
               class="input"
               placeholder="Password"
               required>

        <button type="submit" class="btn login-btn">
          Login
        </button>

      </form>

    </div>

  </div>

</body>
</html>
