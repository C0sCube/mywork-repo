{% extends 'webapp/base.html' %}{% load static %}
{% block title %}Login | Factsheet Parser{% endblock %}
{% block content %}
<div class="login-bg position-fixed top-0 start-0 w-100 d-flex align-items-center justify-content-center p-3" style="z-index:-1"></div>
<div class="row justify-content-center align-items-center" style="min-height:calc(100vh - 80px)">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="text-center text-white mb-4"><img src="{% static 'webapp/img/logo_nse.png' %}" height="56" alt="NSE"><h1 class="h4 mt-3">FACTSHEET PARSER</h1></div>
    <div class="card login-card bg-dark text-white p-4">
      <h2 class="h4 text-center mb-4">Log In</h2>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="{% url 'login' %}" autocomplete="off">
        {% csrf_token %}
        <div class="form-floating mb-3"><input class="form-control" id="username" name="username" placeholder="Username" required autofocus><label for="username">Username</label></div>
        <div class="form-floating mb-3"><input class="form-control" id="password" name="password" type="password" placeholder="Password" required><label for="password">Password</label></div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
