{% load static %}
<!DOCTYPE html>
<html lang="en">
{% include "head.html" %}

<body>
    <header class="header">
        <div class="hero">
            {% include "logo.html" %}
            <h1> CSV <span class="material-symbols-outlined">swap_horiz</span> JSON <span
                    class="material-symbols-outlined">line_end_arrow</span> ADMIN </h1>
        </div>

        <div class="user-section editor-controls">
            <a href="{% url 'dashboard' %}" class="nav-btn" data-action="back">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <span class="user-name">{{ user|capfirst }}</span>

            <a href="{% url 'logout' %}" class="logout-btn">
                <span class="material-symbols-outlined">exit_to_app</span>
            </a>
        </div>
    </header>

    <div class="page csvtojson">
        <div class="csv-container">

            <!-- CARD 1: CSV -->
            <div class="csv-card" data-card="csv" data-state="idle">
                <h3 class="title" id="csvTitle">CSV SECTION</h3>

                <label class="csv-upload">
                    Click Here to Upload: <span class="material-symbols-outlined">csv</span>
                    <input type="file" id="csvInput" accept=".csv" hidden>
                </label>

                <div class="card-actions">
                    <button class="nav-btn secondary" id="csvDldBtn" disabled>
                        <span class="material-symbols-outlined">download_2</span>
                    </button>
                    <button class="nav-btn" id="csvConvertBtn" title = "convert to json" disabled>CONVERT TO JSON</button>
                    <!-- <span class="material-symbols-outlined"> g_translate </span> -->
                    <!-- <span class="material-symbols-outlined" title = "convert to json">convert_to_text</span> -->
                </div>

                <!-- overlay -->
                <div class="card-overlay hidden">
                    <span class="spinner"></span>
                    <span class="overlay-text">Uploading CSV…</span>
                </div>
            </div>

            <!-- CARD 2: JSON -->
            <div class="csv-card" data-card="json" data-state="waiting">
                <h3 class="title" id="jsonTitle">JSON SECTION</h3>

                <label class="csv-upload">
                    Click Here to Upload:<span class="material-symbols-outlined">file_json</span>
                    <input type="file" id="inputJson" accept=".json" hidden>
                </label>

                <div class="card-actions">
                    <button class="nav-btn" id="jsnConvertBtn" title = "convert to csv" disabled>CONVERT TO CSV</button>
                    <!-- <span class="material-symbols-outlined" title = "convert to csv">table_convert</span> -->


                    <button class="nav-btn secondary" id="jsonDldBtn" disabled>
                        <span class="material-symbols-outlined">download_2</span>
                    </button>

                    <button class="nav-btn secondary" id="jsonViewBtn" disabled>
                        <span class="material-symbols-outlined">open_in_new</span>
                    </button>
                </div>

                <div class="card-overlay hidden">
                    <span class="spinner"></span>
                    <span class="overlay-text">Processing JSON…</span>
                </div>
            </div>

            <!-- CARD 3: STATUS -->
            <div class="csv-card" data-card="status" data-state="waiting">
                <h3 class="title">ADMIN PANEL</h3>

                <label class="csv-upload">
                    <pre id="statusConsole" class="mono"> Waiting for input…</pre>
                </label>

                <div class="card-actions">
                    <button class="nav-btn" id="jsonPushBtn" disabled>
                        to Admin Panel
                    </button>
                </div>

            </div>

        </div>
    </div>

</body>
<script src="{% static 'webapp/js/csv_flow.js' %}"></script>
</html>
