{% extends 'webapp/base.html' %}{% load static %}
{% block title %}Config Editor{% endblock %}
{% block header_actions %}
<div class="d-flex align-items-center gap-2 flex-wrap"><select id="yearSelect" class="form-select form-select-sm" style="width:110px"></select><select id="fileSelect" class="form-select form-select-sm" style="min-width:220px"></select><button class="btn btn-outline-light btn-sm" data-action="load" title="Load"><span class="material-symbols-outlined">cached</span></button><button class="btn btn-success btn-sm" data-action="save"><span class="material-symbols-outlined">save</span></button><button class="btn btn-outline-light btn-sm" data-action="create"><span class="material-symbols-outlined">add_box</span></button><button class="btn btn-outline-warning btn-sm" data-action="backup"><span class="material-symbols-outlined">backup</span></button><button class="btn btn-outline-danger btn-sm" data-action="delete"><span class="material-symbols-outlined">delete</span></button><a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm" data-action="back"><span class="material-symbols-outlined">arrow_back</span></a></div>
{% endblock %}
{% block content %}<div class="alert alert-danger py-2 d-none" id="errorDisplay"></div><div class="editor-shell"><textarea id="jsonInput" class="form-control" placeholder="Edit JSON here..."></textarea></div>{% endblock %}
{% block scripts %}<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script><script src="https://cdn.jsdelivr.net/npm/json5@2/dist/index.min.js"></script><script src="{% static 'webapp/js/config_editor.js' %}"></script>{% endblock %}
