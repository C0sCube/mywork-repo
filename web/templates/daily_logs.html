<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=autorenew" />

    <style>
        /* Single scroll area, synced line numbers */
        .log-wrapper {
            display: flex;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            border-radius: 8px;
            height: 400px;
            overflow: hidden;
            /* prevent layout shaking */
        }

        .line-numbers {
            /* background: #e2e8f0; */
            padding: 10px 12px;
            text-align: right;
            font-family: monospace;
            font-size: 0.85rem;
            width: 50px;
            border-right: 1px solid #cbd5e1;
            overflow: hidden;
            /* NO scroll bar */
            user-select: none;
        }

        .log-content {
            flex-grow: 1;
            padding: 10px 15px;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-y: scroll;
            /* ONLY THIS scrolls */
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="hero">
            <img src="{{ url_for('static', filename='img/logo_nse.png') }}" alt="Logo">
            <h1>DAILY LOGS</h1>
        </div>
        <a href="{{ url_for('index') }}" class="nav-btn" onclick="goBackToMain(event)"> ← </a>
    </header>

    <section class="editor-container">

        <!-- Controls -->
        <div class="editor-controls">
            <label for="dateSelect"><strong>Date:</strong></label>
            <input type="date" id="dateSelect" class="input" style="padding:6px 10px;">
            <div class="right-controls">
                <button onclick="loadLog()" class="nav-btn">Load</button>
                <button class="icon-btn" onclick="refreshLog()" title="Refresh">
                    <span class="material-symbols-outlined"> autorenew</span>
                </button>
            </div>
        </div>

        <!-- Log Viewer -->
        <div class="log-wrapper">
            <div id="lineNumbers" class="line-numbers">1</div>
            <div id="logViewer" class="log-content" onscroll="syncScroll()">Select a date to load logs...</div>
        </div>

    </section>

    <script>

        function goBackToMain(e) {
            e.preventDefault();
            if (window.opener) {
                window.opener.focus(); // bring original tab to front
                window.close();        // close this tab
            } else {
                // fallback if no opener reference
                window.location.href = "/";
            }
        }

        let currentDate = null;

        async function loadLog() {
            const date = document.getElementById("dateSelect").value;
            if (!date) {
                alert("Please select a date first.");
                return;
            }

            currentDate = date;

            const resp = await fetch("/load-daily-log", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ date })
            });

            const data = await resp.json();
            const content = data.content || "No logs available for this date.";
            updateLogViewer(content);
        }

        function refreshLog() {
            if (!currentDate) {
                alert("Load a log first.");
                return;
            }
            loadLog();
        }

        function updateLogViewer(text) {
            const viewer = document.getElementById("logViewer");
            const lineBox = document.getElementById("lineNumbers");

            viewer.textContent = text;

            // Generate line numbers
            const lineCount = text.split("\n").length;
            let nums = "01\n02\n03\n04\n05\n06\n07\n08\n09\n";
            for (let i = 10; i <= lineCount; i++) nums += i + "\n";
            lineBox.textContent = nums;

            // Scroll to bottom automatically
            requestAnimationFrame(() => {
                viewer.scrollTop = viewer.scrollHeight;
                lineBox.scrollTop = viewer.scrollTop;
            });
        }

        function syncScroll() {
            // Make line numbers follow the main scroll
            const viewer = document.getElementById("logViewer");
            const lineBox = document.getElementById("lineNumbers");
            lineBox.scrollTop = viewer.scrollTop;
        }
    </script>

</body>

</html>
