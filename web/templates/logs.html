<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Logs | Factsheet Parser</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <nav>
                <a href="/">Upload</a>
                <a href="/logs" class="active">Logs</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="header">
                <div class="hero">
                    <img src="{{ url_for('static', filename='img/logo_nse.svg') }}" alt="Logo">
                    <h1>FACTSHEET PARSER</h1>
                </div>
                <div class="user-section">
                    <span class="user-name">{{ user|capitalize }}</span>
                    <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
                </div>
            </header>

            <section class="upload-section">
                <h2>Application Logs</h2>

                {% if log_files %}
                <div class="logs-container">
                    {% for file in log_files %}
                    <div class="log-item">
                        <span>{{ file }}</span>
                        <a href="{{ url_for('static', filename='logs/' ~ file) }}" target="_blank"
                            class="view-btn">View</a>
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <div class="upload-console">
                    <p>No logs available yet.</p>
                </div>
                {% endif %}
            </section>
        </main>
    </div>
</body>

</html>
