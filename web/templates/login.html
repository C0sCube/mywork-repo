<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Factsheet Parser</title>

  <link rel="icon" href="{{ url_for('static', filename='img/NSE.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/copy.css') }}">
</head>

<body class="login-page">

  <div class="login-container">

    <div class="login-header">
      <img src="{{ url_for('static', filename='img/logo_nse.png') }}" alt="Logo">
      <h1>FACTSHEET PARSER</h1>
    </div>

    <div class="login-card">
      <h2>LOG IN</h2>

      {% if error %}
        <p class="login-error">{{ error }}</p>
      {% endif %}

      <form method="POST">
        <input type="text"
               name="username"
               class="input"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               class="input"
               placeholder="Password"
               required>

        <button type="submit" class="btn login-btn">
          Login
        </button>
      </form>
    </div>

  </div>

</body>
</html>
