<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Config Editor</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/NSE.ico') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/json5@2/dist/index.min.js"></script>
</head>

<body>
<header class="header">
  <div class="hero">
    <a href="{{ url_for('index') }}" data-action="back">
      <img src="{{ url_for('static', filename='img/logo_nse.png') }}" alt="Logo">
    </a>
    <h1>CONFIG EDITOR</h1>
  </div>

  <div class="editor-controls">
    <div id="errorDisplay" class="error-message"></div>

    <label><strong>Year:</strong></label>
    <select id="yearSelect" class="input"></select>

    <label><strong>File:</strong></label>
    <select id="fileSelect" class="input"></select>

    <button class="nav-btn" data-action="load" title="Load">
      <span class="material-symbols-outlined">cached</span>
    </button>

    <button class="nav-btn" data-action="save" title="Save">
      <span class="material-symbols-outlined">save</span>
    </button>

    <button class="nav-btn" data-action="create" title="Create">
      <span class="material-symbols-outlined">add_box</span>
    </button>

    <button class="nav-btn" data-action="delete" title="Delete">
      <span class="material-symbols-outlined">delete</span>
    </button>

    <button class="nav-btn" data-action="backup" title="Backup">
      <span class="material-symbols-outlined">backup</span>
    </button>

    <a href="{{ url_for('index') }}" class="nav-btn" data-action="back">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
  </div>
</header>

<section class="editor-container">
  <textarea id="jsonInput" placeholder="Edit JSON here..."></textarea>
</section>

<!-- ✅ correct static loading -->
<script src="{{ url_for('static', filename='js/config_editor.js') }}"></script>
</body>
</html>
