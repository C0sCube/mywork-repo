<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Config Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/NSE.ico') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/json5@2/dist/index.min.js"></script>


</head>

<body>
  <header class="header">
    <div class="hero">
      <a href="{{ url_for('index') }}" onclick="goBackToMain(event)"><img
          src="{{ url_for('static', filename='img/logo_nse.png') }}" alt="Logo"></a>
      <h1>CONFIG EDITOR</h1>
    </div>
    <a href="{{ url_for('index') }}" class="nav-btn" , onclick="goBackToMain(event)"><span
        class="material-symbols-outlined">
        arrow_back
      </span></a>
  </header>

  <section class="editor-container">
    <div class="editor-controls">
      <label for="yearSelect"><strong>Year:</strong></label>
      <select id="yearSelect" class="input"></select>

      <label for="fileSelect"><strong>File:</strong></label>
      <select id="fileSelect" class="input"></select>
      <button onclick="loadConfig()" class="nav-btn" title="load"><span class="material-symbols-outlined">
          cached
        </span></button>
      <button onclick="saveConfig()" class="nav-btn" title="save"><span class="material-symbols-outlined">
          save
        </span></button>
      <button onclick="createConfig()" class="nav-btn" title="create"><span class="material-symbols-outlined">
          add_box
        </span></button>
      <button onclick="deleteConfig()" class="nav-btn" title="delete"><span class="material-symbols-outlined">
          delete
        </span></button>
      <button onclick="backupConfig()" class="nav-btn" title="backup"><span class="material-symbols-outlined">
          backup
        </span></button>
      <div id="errorDisplay" class="error-message"></div>
    </div>

    <textarea id="jsonInput" placeholder="Edit JSON here..."></textarea>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/json5@2/dist/index.min.js"></script>
  <script>

    function goBackToMain(e) {
      e.preventDefault();
      if (window.opener) {
        window.opener.focus(); // bring original tab to front
        window.close();        // close this tab
      } else {
        // fallback if no opener reference
        window.location.href = "/";
      }
    }
    const jsonInput = document.getElementById("jsonInput");
    const errorDisplay = document.getElementById("errorDisplay");

    const years = [
      "2025","2024","2023","2022", "2021", "2020", "2019",
      "2026", "0000", "0001"
    ];
    const yearSelect = document.getElementById("yearSelect");
    const fileSelect = document.getElementById("fileSelect");

    years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    });

    yearSelect.addEventListener("change", async () => {
      const year = yearSelect.value;
      const resp = await fetch(`/list-files/${year}`);
      const data = await resp.json();
      fileSelect.innerHTML = "";
      data.files.forEach(f => {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = f;
        fileSelect.appendChild(opt);
      });
    });

    async function createConfig() {
      const year = yearSelect.value;
      if (!year) {
        alert("Please select a year first.");
        return;
      }

      const filename = prompt("Enter new config filename (without extension):");
      if (!filename) return;

      const extension = prompt("Choose extension: json or json5", "json");
      const fullName = `${filename}.${extension}`;

      try {
        const resp = await fetch("/create-config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ year, filename: fullName })
        });

        if (resp.status === 401) {
          alert("You are logged out. Please log in again.");
          window.location = "/login";
          return;
        }

        const result = await resp.json();
        if (result.success) {
          alert(`Created ${fullName}`);
          // refresh file list
          yearSelect.dispatchEvent(new Event("change"));
          // optionally load the new file into editor
          fileSelect.value = fullName;
          jsonInput.value = "{}";
        } else {
          alert("Create failed: " + result.error);
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    async function deleteConfig() {
      const year = yearSelect.value;
      const filename = fileSelect.value;
      if (!filename) {
        alert("No file selected.");
        return;
      }
      if (!confirm(`Delete ${filename}?`)) return;

      const resp = await fetch("/delete-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ year, filename })
      });


      if (resp.status === 401) {
        alert("You are logged out. Please log in again.");
        window.location = "/login";
        return;
      }


      const result = await resp.json();
      alert(result.success ? "Deleted successfully!" : "Delete failed: " + result.error);

      // refresh file list
      yearSelect.dispatchEvent(new Event("change"));
      jsonInput.value = "";
    }

    async function loadConfig() {
      const year = yearSelect.value;
      const filename = fileSelect.value;
      const resp = await fetch("/load-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ year, filename })
      });

      if (resp.status === 401) {
        alert("You are logged out. Please log in again.");
        window.location = "/login";
        return;
      }

      const result = await resp.json();
      if (result.success) {
        jsonInput.value = JSON.stringify(result.data, null, 2);
        validateJSON();
      } else {
        alert("Error loading config: " + result.error);
      }
    }

    async function saveConfig() {
      if (!validateJSON()) return;
      const year = yearSelect.value;
      const filename = fileSelect.value;
      const content = jsonInput.value;
      const resp = await fetch("/save-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ year, filename, content })
      });

      if (resp.status === 401) {
        alert("You are logged out. Please log in again.");
        window.location = "/login";
        return;
      }

      const result = await resp.json();
      alert(result.success ? "Saved successfully!" : "Save failed: " + result.error);
    }

    async function backupConfig() {
      const year = yearSelect.value;
      const filename = fileSelect.value;
      const resp = await fetch("/backup-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ year, filename })
      });

      if (resp.status === 401) {
        alert("You are logged out. Please log in again.");
        window.location = "/login";
        return;
      }

      const result = await resp.json();
      alert(result.success ? "Backup triggered!" : "Backup failed: " + result.message);
    }

    function validateJSON() {
      try {

        JSON.parse(jsonInput.value);
        jsonInput.classList.remove("invalid");
        errorDisplay.textContent = "";
        return true;
      } catch (jsonError) {
        try {

          JSON5.parse(jsonInput.value);
          jsonInput.classList.remove("invalid");
          errorDisplay.textContent = "";
          return true;
        } catch (json5Error) {

          jsonInput.classList.add("invalid");
          errorDisplay.textContent = "Invalid JSON/JSON5: " + json5Error.message;
          return false;
        }
      }
    }

    // Auto-load files for the first year
    yearSelect.value = years[0];
    yearSelect.dispatchEvent(new Event("change"));
  </script>
</body>

</html>
