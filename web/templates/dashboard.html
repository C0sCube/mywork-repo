<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mutual Fund Parser Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <section class="main-bg">
        <div class="header">
            <div class="hero">
                <img src="{{ url_for('static', filename='img/logo_nse.svg') }}" alt="Logo">
                <h1>FACTSHEET PARSER</h1>
            </div>
            <div class="user-section">
                <span class="user-name">{{ user|capitalize }}</span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="main">
            <h2>UPLOAD FACTSHEET PDF</h2>


            <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="pdfs" id="pdfs" accept="application/pdf" multiple required
                    onchange="showSelectedFiles(event)">

                <!-- Side-by-side layout for size and button -->
                <div style="display: flex; justify-content: center; align-items: center; margin-top: 10px;">
                    <!-- Total size display -->
                    <div style="flex: 1; text-align: center; font-weight: bold; font-size: 16px;" id="sizeDisplay">
                        Total size: 0 MB
                    </div>

                    <!-- Upload button -->
                    <div style="flex: 1; text-align: center;">
                        <button type="submit" style="padding: 8px 16px; font-size: 16px;">UPLOAD</button>
                    </div>
                </div>
            </form>
            <!-- Console-style Display -->
            <div class="upload-console" id="uploadConsole">
                <p>No files selected.</p>
            </div>

            {% if error %}
            <div class="upload-console error">
                <p>{{ error }}</p>
            </div>
            {% endif %}
        </div>
    </section>

    <script>
        let selectedFiles = [];

        document.getElementById("pdfs").addEventListener("change", function (event) {
            selectedFiles = Array.from(event.target.files);
            updateConsoleDisplay();
        });

        function updateConsoleDisplay() {
            const uploadConsole = document.getElementById("uploadConsole");
            const sizeDisplay = document.getElementById("sizeDisplay");
            const uploadBtn = document.querySelector("#uploadForm button[type='submit']");
            const maxSize = 50 * 1024 * 1024;
            let totalSize = 0;

            uploadConsole.innerHTML = ""; // Clear previous content

            selectedFiles.forEach((file, index) => {
                totalSize += file.size;

                const fileTag = document.createElement("div");
                fileTag.style.cssText = "background:#f4f4f4; padding:6px 10px; margin:4px 0; border-radius:4px; display:flex; justify-content:space-between; align-items:center;";

                const fileInfo = document.createElement("span");
                fileInfo.textContent = `${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;

                const removeBtn = document.createElement("button");
                removeBtn.textContent = "☠️";
                removeBtn.style.cssText = "border:none; background:none; cursor:pointer; font-size:16px;";
                removeBtn.onclick = () => {
                    selectedFiles.splice(index, 1);
                    updateConsoleDisplay();
                };

                fileTag.appendChild(fileInfo);
                fileTag.appendChild(removeBtn);
                uploadConsole.appendChild(fileTag);
            });

            sizeDisplay.textContent = `Total size: ${(totalSize / (1024 * 1024)).toFixed(2)} MB`;
            sizeDisplay.style.color = totalSize > maxSize ? "red" : "green";
            uploadBtn.disabled = totalSize > maxSize;

            if (selectedFiles.length === 0) {
                uploadConsole.innerHTML = "<p>No files selected.</p>";
            }
        }

    </script>
</body>

</html>
