<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard | Factsheet Parser</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <nav>
                <a href="/" class="active">Upload</a>
                <a href="/logs">Logs</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="header">
                <div class="hero">
                    <img src="{{ url_for('static', filename='img/logo_nse.svg') }}" alt="Logo">
                    <h1>FACTSHEET PARSER</h1>
                </div>
                <div class="user-section">
                    <span class="user-name">{{ user|capitalize }}</span>
                    <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
                </div>
            </header>

            <section class="upload-section">
                <h2>Upload Factsheet PDFs</h2>

                <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
                    <input type="file" name="pdfs" id="pdfs" accept="application/pdf" multiple>

                    <div class="upload-grid">
                        <div id="sizeDisplay">Total Size: 0 MB</div>
                        <button type="submit" id="uploadBtn">Upload</button>
                    </div>
                </form>

                <div class="upload-console" id="uploadConsole">
                    <p>No files selected.</p>
                </div>

                {% if error %}
                <div class="upload-console error">
                    <p>{{ error }}</p>
                </div>
                {% endif %}
            </section>
        </main>
    </div>

    <script>
        let selectedFiles = [];

        document.getElementById("pdfs").addEventListener("change", (e) => {
            const newFiles = Array.from(e.target.files);
            selectedFiles = [...selectedFiles, ...newFiles]; // append not reset
            updateDisplay();
        });

        function updateDisplay() {
            const consoleDiv = document.getElementById("uploadConsole");
            const sizeDiv = document.getElementById("sizeDisplay");
            const maxSize = 50 * 1024 * 1024;
            let totalSize = 0;
            consoleDiv.innerHTML = "";

            selectedFiles.forEach((f, i) => {
                totalSize += f.size;
                const item = document.createElement("div");
                item.className = "file-item";
                item.innerHTML = `
          <span>${f.name} (${(f.size / 1048576).toFixed(2)} MB)</span>
          <button class="remove-btn" onclick="removeFile(${i})">✖</button>
        `;
                consoleDiv.appendChild(item);
            });

            if (!selectedFiles.length) consoleDiv.innerHTML = "<p>No files selected.</p>";

            sizeDiv.textContent = `Total Size: ${(totalSize / 1048576).toFixed(2)} MB`;
            sizeDiv.style.color = totalSize > maxSize ? "red" : "green";
            document.getElementById("uploadBtn").disabled = totalSize > maxSize;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateDisplay();
        }
    </script>
</body>

</html>
