<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Factsheet Parser Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <section class="main-bg">
        <div class="header">
            <div class="hero">
                <img src="{{ url_for('static', filename='img/logo_nse.svg') }}" alt="Logo">
                <h1>FACTSHEET PARSER</h1>
            </div>
            <div class="user-section">
                <span class="user-name">{{ user|capitalize }}</span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="main-dashboard">
            <!-- Upload Section -->
            <div class="panel upload-panel">
                <h2>Upload Factsheet PDFs</h2>

                <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
                    <input type="file" name="pdfs" id="pdfs" accept="application/pdf" multiple>
                    <div class="upload-grid">
                        <div id="sizeDisplay">Total Size: 0 MB</div>
                        <button type="submit" id="uploadBtn">Upload</button>
                    </div>
                </form>

                <div class="upload-console" id="uploadConsole">
                    <p>No files selected.</p>
                </div>

                {% if error %}
                <div class="upload-console error">
                    <p>{{ error }}</p>
                </div>
                {% endif %}
            </div>

            <!-- Logs Section -->
            <div class="panel logs-panel">
                <h2>Application Logs</h2>
                <div class="logs-controls">
                    <button id="refreshLogsBtn" class="small" onclick="loadLogs()">Refresh</button>
                    <label>
                        <input type="checkbox" id="autoRefresh"> Auto-refresh
                    </label>
                </div>
                <div class="upload-console" id="logsConsole">
                    <p>Loading logs…</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // --- Upload logic ---
        let selectedFiles = [];

        document.getElementById("pdfs").addEventListener("change", (e) => {
            const newFiles = Array.from(e.target.files);
            selectedFiles = selectedFiles.concat(newFiles);
            updateUploadDisplay();
        });

        function updateUploadDisplay() {
            const consoleDiv = document.getElementById("uploadConsole");
            const sizeDiv = document.getElementById("sizeDisplay");
            const maxSize = 50 * 1024 * 1024;
            let totalSize = 0;
            consoleDiv.innerHTML = "";

            selectedFiles.forEach((f, i) => {
                totalSize += f.size;
                const item = document.createElement("div");
                item.className = "file-item";
                item.innerHTML = `
          <span>${f.name} (${(f.size / 1048576).toFixed(2)} MB)</span>
          <button class="remove-btn" onclick="removeFile(${i})">✖</button>
        `;
                consoleDiv.appendChild(item);
            });

            if (!selectedFiles.length) consoleDiv.innerHTML = "<p>No files selected.</p>";

            sizeDiv.textContent = `Total Size: ${(totalSize / 1048576).toFixed(2)} MB`;
            sizeDiv.style.color = totalSize > maxSize ? "red" : "green";
            document.getElementById("uploadBtn").disabled = totalSize > maxSize;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateUploadDisplay();
        }

        document.getElementById("uploadForm").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            if (!selectedFiles.length) return alert("No files selected.");

            const fd = new FormData();
            selectedFiles.forEach(f => fd.append("pdfs", f, f.name));

            const resp = await fetch("/upload", { method: "POST", body: fd });
            if (resp.redirected) window.location = resp.url;
            else window.location.reload();
        });

        // --- Logs logic ---
        let logsInterval = null;

        async function loadLogs() {
            const logsConsole = document.getElementById("logsConsole");
            logsConsole.innerHTML = "<p>Refreshing logs…</p>";
            try {
                const resp = await fetch("/logs", { cache: "no-store" });
                const html = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                const logsContainer = doc.querySelector(".logs-container");
                logsConsole.innerHTML = "";
                if (logsContainer) {
                    Array.from(logsContainer.children).forEach(node => {
                        const span = node.querySelector("span");
                        const link = node.querySelector("a");
                        const entry = document.createElement("div");
                        entry.className = "log-item";
                        entry.innerHTML = `<span>${span ? span.textContent.trim() : node.textContent.trim()}</span>
                               <a class="view-btn" href="${link ? link.href : '#'}" target="_blank">View</a>`;
                        logsConsole.appendChild(entry);
                    });
                } else {
                    logsConsole.innerHTML = "<p>No logs found.</p>";
                }
            } catch (err) {
                logsConsole.innerHTML = "<p>Error loading logs.</p>";
                console.error(err);
            }
        }

        document.getElementById("autoRefresh").addEventListener("change", (e) => {
            if (e.target.checked) {
                logsInterval = setInterval(loadLogs, 10000);
            } else {
                clearInterval(logsInterval);
            }
        });

        loadLogs();
    </script>
</body>

</html>
