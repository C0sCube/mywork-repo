<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Factsheet Parser Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <section class="main-bg">
        <div class="header">
            <div class="hero">
                <img src="{{ url_for('static', filename='img/logo_nse.png') }}" alt="Logo">
                <h1>FACTSHEET PARSER</h1>
            </div>
            <div class="user-section">
                <a href="http://172.22.225.179/adminpanel/parsedjson/" style="text-decoration: none;" target="_blank"
                    class="user-name input">view json</a>
                <span class="user-name input">{{ user|capitalize }}</span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="main-dashboard">




            <div id="uploadDrawer" class="upload-drawer">
                <div class="upload-panel">
                    <h2>FactSheet PDF</h2>

                    <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
                        <input type="file" name="pdfs" id="pdfs" accept="application/pdf" multiple>
                        <div class="upload-grid">
                            <div id="sizeDisplay">Size 0 MB</div>
                            <button type="submit" id="uploadBtn" class="input">Upload</button>
                        </div>
                    </form>

                    <div class="upload-console" id="uploadConsole">
                        <p>No files selected.</p>
                    </div>

                    {% if error %}
                    <div class="upload-console error">
                        <p>{{ error }}</p>
                    </div>
                    {% endif %}
                </div>
            </div>


            <div class="panel logs-panel">
                <h3>PROCESSING STATUS</h3>
                <div class="upload-console" id="logsConsole">
                    <p>Loading logs…</p>
                </div>

                <div class="logs-controls">
                    <button id="refreshLogsBtn" class="small input" onclick="loadLogs()">Refresh</button>
                    <label><input type="checkbox" id="autoRefresh" class="input"> Auto-refresh</label>
                </div>
            </div>

            <button id="drawerToggle" class="drawer-toggle">➤</button>
        </div>
    </section>

    <script>

        document.getElementById("drawerToggle").addEventListener("click", () => {
            const drawer = document.getElementById("uploadDrawer");
            drawer.classList.toggle("open");
        });
        // --- Upload logic ---
        let selectedFiles = [];

        document.getElementById("pdfs").addEventListener("change", (e) => {
            const newFiles = Array.from(e.target.files);
            selectedFiles = selectedFiles.concat(newFiles);
            updateUploadDisplay();
        });

        function updateUploadDisplay() {
            const consoleDiv = document.getElementById("uploadConsole");
            const sizeDiv = document.getElementById("sizeDisplay");
            const maxSize = 50 * 1024 * 1024;
            let totalSize = 0;
            consoleDiv.innerHTML = "";

            selectedFiles.forEach((f, i) => {
                totalSize += f.size;
                const item = document.createElement("div");
                item.className = "file-item";
                item.innerHTML = `
          <span>${f.name} (${(f.size / 1048576).toFixed(2)} MB)</span>
          <button class="remove-btn" onclick="removeFile(${i})">✖</button>
        `;
                consoleDiv.appendChild(item);
            });

            if (!selectedFiles.length) consoleDiv.innerHTML = "<p>No files selected.</p>";

            sizeDiv.textContent = `Size ${(totalSize / 1048576).toFixed(2)} MB`;
            sizeDiv.style.color = totalSize > maxSize ? "red" : "green";
            document.getElementById("uploadBtn").disabled = totalSize > maxSize;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateUploadDisplay();
        }

        document.getElementById("uploadForm").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            if (!selectedFiles.length) return alert("No files selected.");

            const fd = new FormData();
            selectedFiles.forEach(f => fd.append("pdfs", f, f.name));

            const resp = await fetch("/upload", { method: "POST", body: fd });
            if (resp.redirected) window.location = resp.url;
            else window.location.reload();
        });

        // --- Logs logic ---
        let logsInterval = null;

        async function loadLogs() {
            const logsConsole = document.getElementById("logsConsole");
            // const jsonConsole = document.getElementById("jsonConsole");

            logsConsole.innerHTML = "<p>Refreshing status…</p>";
            // jsonConsole.innerHTML = "<p>Refreshing outputs…</p>";

            try {
                // Fetch MySQL table data
                const resp = await fetch("/status_data");
                const data = await resp.json();

                if (!data.success || !data.rows.length) {
                    logsConsole.innerHTML = "<p>No status records yet.</p>";
                    return;
                }

                // Build a mini-table for recent processing
                const table = document.createElement("table");
                table.className = "status-table";
                table.innerHTML = `
            <tr>
                <th>File Name</th>
                <th>Start</th>
                <th>End</th>
                <th>Status</th>
                <th>Error</th>
            </tr>
        `;

                // <th>JSON Path</th>

                data.rows.forEach(row => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                <td>${row.file_name || "-"}</td>
                <td>${row.start_time || "-"}</td>
                <td>${row.end_time || "-"}</td>
                <td class="${row.status?.toLowerCase() || ''}">${row.status || "-"}</td>
                <td>${row.error || ""}</td>
            `;
                    table.appendChild(tr);
                });

                logsConsole.innerHTML = "";
                logsConsole.appendChild(table);

            } catch (err) {
                logsConsole.innerHTML = "<p>Error fetching status data.</p>";
                console.error(err);
            }
        }
    </script>
</body>

</html>
