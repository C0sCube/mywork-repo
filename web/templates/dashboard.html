<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Factsheet Parser Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>


<body>
    <!-- HEADER -->
    <header class="header">
        <div class="hero">
            <img src="{{ url_for('static', filename='img/logo_nse.png') }}" alt="Logo">
            <h1>FACTSHEET PARSER</h1>
        </div>

        <div class="user-section">
            {% if user is defined and user|lower == 'kaustubh.keny' %}
            <a href="{{ url_for('config_editor') }}" class="nav-btn" target="_self" , onclick="openInNewTab(event)">
                configs
            </a>
            <a href="{{ url_for('daily_logs') }}" class="nav-btn" target="_self" , onclick="openInNewTab(event)">
                logs
            </a>
            {% endif %}

            <!-- SAME BUTTON STYLE -->
            <!-- <a href="http://172.22.225.179/adminpanel/parsedjson/" target="_blank" class="nav-btn">
                json
            </a> -->

            <!-- SAME BUTTON STYLE -->
            <button class="nav-btn" onclick="toggleModal(true)">upload</button>

            <!-- USERNAME (PLAIN TEXT) -->
            <span style="font-weight:600; color:#e5e7eb;">
                {{ user|capitalize }}
            </span>

            <a href="{{ url_for('logout') }}" class="logout-btn">logout</a>
        </div>
    </header>


    <!-- MAIN CONTENT -->
    <section class="main-dashboard">

        <!-- LOGS PANEL -->
        <div class="panel logs-panel">

            <div class="logs-bar">
                <h3>Status Report</h3>
                <div class="right-controls">
                    <label class="auto-refresh">
                        <input type="checkbox"> <strong>auto-refresh</strong>
                    </label>
                    <button class="icon-btn" onclick="loadLogs()" title="Refresh">
                        <!-- <span class="material-symbols-outlined">refresh</span> -->
                        <span class="material-symbols-outlined"> autorenew</span>
                    </button>
                </div>
            </div>

            <div id="logsConsole">
                <p>Loading status…</p>
            </div>

        </div>
    </section>

    <!-- UPLOAD MODAL -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="logs-bar">
                <h2>FactSheet Upload</h2>
                <button class="close-btn" onclick="toggleModal(false)">
                    <span class="material-symbols-outlined">
                        close
                    </span>
                </button>
            </div>

            <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="pdfs" id="pdfs" accept="application/pdf" multiple>
                <div class="logs-bar">
                    <div id="sizeDisplay">Size 0 MB</div>
                    <button type="submit" class="nav-btn">Upload</button>
                </div>
            </form>
            <div class="upload-console" id="uploadConsole">
                <p>No files selected.</p>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>

        function openInNewTab(e) {
            e.preventDefault();
            window.open(e.target.href, "_blank");
        }
        function goBackToMain(e) {
            e.preventDefault();
            if (window.opener) {
                window.opener.focus(); // bring original tab to front
                window.close();        // close this tab
            } else {
                // fallback if no opener reference
                window.location.href = "/";
            }
        }


        let amcRegistry = {};

        // Load AMC registry once
        async function loadRegistry() {
            try {
                const resp = await fetch("/company_registry");
                amcRegistry = await resp.json();
            } catch (err) {
                console.error("Failed to load AMC registry", err);
                amcRegistry = {};
            }
        }


        /* ---------- MODAL ---------- */
        function toggleModal(state) {
            const modal = document.getElementById("uploadModal");

            if (state) {
                modal.classList.add("show");
            } else {
                modal.classList.remove("show");
            }
        }

        /* ---------- UPLOAD LOGIC ---------- */
        let selectedFiles = [];

        document.getElementById("pdfs").addEventListener("change", (e) => {
            selectedFiles = Array.from(e.target.files);
            updateUploadDisplay();
        });

        function updateUploadDisplay() {
            const consoleDiv = document.getElementById("uploadConsole");
            const sizeDiv = document.getElementById("sizeDisplay");

            let totalSize = 0;
            consoleDiv.innerHTML = "";

            selectedFiles.forEach((f, i) => {
                totalSize += f.size;

                const item = document.createElement("div");
                item.className = "file-item";
                item.innerHTML = `
                    <span>${f.name} (${(f.size / 1048576).toFixed(2)} MB)</span>
                    <button class="remove-btn" onclick="removeFile(${i})">✖</button>
                `;
                consoleDiv.appendChild(item);
            });

            if (selectedFiles.length === 0) {
                consoleDiv.innerHTML = "<p>No files selected.</p>";
            }

            sizeDiv.textContent = `Size ${(totalSize / 1048576).toFixed(2)} MB`;

            const maxSize = 50 * 1024 * 1024;
            sizeDiv.style.color = totalSize > maxSize ? "red" : "green";

            document.getElementById("uploadBtn").disabled = totalSize > maxSize;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateUploadDisplay();
        }

        document.getElementById("uploadForm").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            if (!selectedFiles.length) return alert("No files selected.");

            const fd = new FormData();
            selectedFiles.forEach(file => fd.append("pdfs", file, file.name));

            const resp = await fetch("/upload", { method: "POST", body: fd });
            if (resp.redirected) window.location = resp.url;
        });

        function safeText(text) {
            return (text || "").toString().trim();
        }

        /* ---------- STATUS / LOGS ---------- */
        async function loadLogs() {
            const logsConsole = document.getElementById("logsConsole");
            logsConsole.innerHTML = "<p>Refreshing…</p>";

            try {
                const resp = await fetch("/status_data");
                const data = await resp.json();

                if (!data.success || !data.rows.length) {
                    logsConsole.innerHTML = "<p>No status yet.</p>";
                    return;
                }

                const table = document.createElement("table");
                table.className = "status-table";

                table.innerHTML =
                    `<tr>
                    <th style="width:45px; text-align:center;">No</th>
                    <th style="width:200px; text-align:center;">File Name</th>
                    <th style="width:145px; text-align:center;">ProcessedAt</th>
                    <th style="width:100px; text-align:center;">Status</th>
                    <th style="width:70px;">Json</th>
                    <th style="width:140px; text-align:center;">UploadedBy</th>
                    <th style="text-align:center;">Error</th>
                </tr>`;

                data.rows.forEach((row, index) => {
                    const tr = document.createElement("tr");

                    // Extract code as string from filename (before first "_")
                    const match = row.file_name.match(/^(\d+)_/);
                    const code = match ? match[1] : null;

                    // Lookup in registry (keys are strings)
                    const amcName = code && amcRegistry[code] ? amcRegistry[code] : "Unknown AMC";
                    tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><a href="/viewer/pdf/${row.file_name}"  target="_blank" class="menu__link" title="${amcName}">${row.file_name}</a></td>
                    <td>${formatISTDate(row.end_time) || "-"}</td>
                    <td class="${row.status?.toLowerCase() || ''}">${row.status || "-"}</td>
                    <td>${row.json_path ? `<a href="/viewer/json/${row.file_name.replace('.pdf', '.json')}" target="_blank" class="menu__link">JSON</a>` : "-"} </td>
                    <td>${row.uploaded_by || "-"}</td>
                    <td>${row.error || "-"}</td>`;

                    table.appendChild(tr);

                    // ------- INLINE JSON ROW -------
                    const jsonRow = document.createElement("tr");
                    jsonRow.id = "jsonRow_" + index;
                    jsonRow.style.display = "none";
                    jsonRow.innerHTML =
                        `<td colspan="6" class="json-cell">
                    <div id="jsonContent_${index}" class="json-box"></div></td>`;
                    table.appendChild(jsonRow);
                });
                logsConsole.innerHTML = "";
                logsConsole.appendChild(table);

            } catch (err) {
                logsConsole.innerHTML = "<p>Error loading logs.</p>";
            }
        }

        // Auto-refresh status
        setInterval(() => {
            if (document.getElementById("autoRefresh").checked) {
                loadLogs();
            }
        }, 15000);

        (async () => {
            await loadRegistry();  // fetch AMC registry first
            await loadLogs();      // then build logs with tooltips
        })();

        function formatISTDate(dateString) {
            if (!dateString) return "-";
            const date = new Date(dateString);
            // Convert to IST
            const options = {
                timeZone: "Asia/Kolkata",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            };
            const parts = new Intl.DateTimeFormat("en-GB", options).formatToParts(date);

            // Build format: YYYY/MM/DD H:M
            const year = parts.find(p => p.type === "year").value;
            const month = parts.find(p => p.type === "month").value;
            const day = parts.find(p => p.type === "day").value;
            const hour = parts.find(p => p.type === "hour").value;
            const minute = parts.find(p => p.type === "minute").value;

            return `${year}/${month}/${day} ${hour}:${minute}`;
        }

        async function toggleJson(index, jsonFilename) {
            const row = document.getElementById("jsonRow_" + index);
            const container = document.getElementById("jsonContent_" + index);

            // collapse logic
            if (row.style.display === "table-row") {
                row.style.display = "none";
                container.innerHTML = "";
                return;
            }

            // expand
            row.style.display = "table-row";
            container.innerHTML = "<p>Loading JSON...</p>";

            try {
                const resp = await fetch("/viewer/json/" + jsonFilename);
                const data = await resp.json();

                container.innerHTML = `
            <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
            } catch (err) {
                container.innerHTML = "<p style='color:red;'>Error loading JSON.</p>";
            }
        }

    </script>

</body>

</html>
